<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互动课件演示</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:clamp(20px,4vw,48px);font-family:"Microsoft YaHei",sans-serif;color:#15263a;background:radial-gradient(circle at 88% 10%,#d8f6ff 0 15%,transparent 16%),linear-gradient(135deg,#fff9df,#f7fffd)}
    .tag{display:inline-block;padding:7px 11px;border:2px solid #17263a;border-radius:8px;background:#8ce8ff;font-size:11px;font-weight:900;letter-spacing:.12em;box-shadow:3px 3px 0 #17263a}h1{max-width:700px;margin:24px 0 10px;font-size:clamp(28px,5vw,54px);line-height:1.12}h1 em{color:#f15d39;font-style:normal}p{max-width:680px;color:#5d6874;line-height:1.8}.code{max-width:700px;margin:26px 0;padding:20px 24px;border:3px solid #17263a;border-radius:16px;background:#17263a;color:#f8ffdb;box-shadow:7px 8px 0 #7bd9f4;font:700 16px/1.8 Consolas,monospace}.code b{color:#ffd95c}.question{max-width:700px;margin-top:28px;padding:24px;border:2px solid #17263a;border-radius:18px;background:white;box-shadow:6px 7px 0 #17263a}.question h2{margin:0 0 16px;font-size:20px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{min-height:48px;padding:10px;border:2px solid #17263a;border-radius:11px;background:#fff;cursor:pointer;font-weight:800;transition:.15s}button:hover{translate:0 -2px;background:#fff4bd}button.correct{background:#8ff0a8}button.wrong{background:#ffaaa0}.feedback{min-height:24px;margin:15px 0 0;font-weight:800}@media(max-width:520px){.answers{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <span class="tag">PYTHON · LEVEL 02</span>
  <h1>程序也会做选择：<em>if 条件判断</em></h1>
  <p>生活中我们每天都在做选择。程序使用 <strong>if</strong> 来判断条件是否成立，再决定下一步做什么。</p>
  <div class="code"><b>score</b> = 85<br />if <b>score</b> &gt;= 60:<br />&nbsp;&nbsp;&nbsp;&nbsp;print("挑战成功！")</div>
  <div class="question"><h2>🎯 小挑战：这段程序会输出什么？</h2><div class="answers"><button onclick="answer(this,false)">继续努力</button><button onclick="answer(this,true)">挑战成功！</button><button onclick="answer(this,false)">85</button><button onclick="answer(this,false)">不会输出</button></div><p class="feedback" id="feedback"></p></div>
  <script>
    function answer(button, correct){document.querySelectorAll('button').forEach(function(item){item.classList.remove('correct','wrong')});button.classList.add(correct?'correct':'wrong');document.getElementById('feedback').textContent=correct?'回答正确，获得 10 积分！':'还差一点，再看看判断条件。';parent.postMessage({type:'growth-courseware:score',questionId:'demo-if-001',correct:correct,points:10},location.origin)}
  </script>
</body>
</html>
